<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Asteroids — Retro Arcade</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#07110f;color:#e0f6ec;font-family:Consolas,Monaco,monospace;min-height:100vh;display:grid;place-items:center;padding:20px}.app{width:min(100%,920px)}h1{text-align:center;letter-spacing:8px;color:#baffda;text-shadow:0 0 20px #66ddaa;margin:0 0 20px}.cabinet{background:#070e12;border:2px solid #37554d;border-radius:12px;padding:12px;box-shadow:inset 0 0 30px #102d24}.hud{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:clamp(11px,2vw,15px);letter-spacing:1px;margin-bottom:10px}.hud strong{color:#baffda}.stage{position:relative;width:100%;aspect-ratio:1.65;min-height:240px;background:#020708;border:1px solid #284d40;border-radius:5px;overflow:hidden;touch-action:none}canvas{display:block;width:100%;height:100%}.overlay{position:absolute;inset:0;background:#020708d9;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:14px;padding:15px}.overlay h2{font-size:clamp(24px,6vw,55px);letter-spacing:6px;color:#baffda;text-shadow:0 0 15px #5ff2a6;margin:0}.small{color:#8fbbaa;font-size:clamp(10px,1.7vw,13px);letter-spacing:1px}button{border:1px solid #4b9e78;background:#13291f;color:#c5ffe1;padding:12px 16px;border-radius:6px;font-weight:800;letter-spacing:1px;cursor:pointer;touch-action:none}button:active{background:#3d7455}.start{background:#b3f5cc;color:#061e12;border-color:#b3f5cc}.controls{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:12px}.group{display:flex;gap:8px}.group button{min-width:53px;min-height:49px}.help{font-size:12px;color:#81a99a;line-height:1.7;margin:15px 4px;text-align:center}@media(max-width:480px){body{padding:8px}.cabinet{padding:7px}.controls{justify-content:center}.group button{min-width:46px;padding:12px 9px}h1{font-size:25px}}
</style></head><body><main class="app"><h1>ASTEROIDS</h1><div class="cabinet"><div class="hud"><span>SCORE <strong id="score">00000</strong></span><span id="wave">WAVE 1</span><span>LIVES <strong id="lives">3</strong></span></div><div class="stage" id="stage"><canvas id="canvas" aria-label="Asteroids game canvas"></canvas><div class="overlay" id="overlay"><div class="small">THE CLASSIC ARCADE EXPERIENCE</div><h2 id="title">ASTEROIDS</h2><div class="small" id="subtitle">DESTROY THE ROCKS. SURVIVE THE VOID.</div><button class="start" id="start">START GAME ▶</button><div class="small">HIGH SCORE <span id="best">00000</span></div></div></div><div class="controls"><div class="group"><button data-key="left" aria-label="Rotate left">↶</button><button data-key="thrust" aria-label="Thrust">↑</button><button data-key="right" aria-label="Rotate right">↷</button></div><div class="group"><button data-key="hyper">HYPER</button><button data-key="fire" style="background:#375b42">● FIRE</button><button id="pause">Ⅱ</button></div></div></div><div class="help">← → ROTATE · ↑ THRUST · SPACE FIRE · H HYPERSPACE · P PAUSE<br>On phones and tablets use the on-screen buttons. Clear each wave to earn 100 bonus points!</div></main>
<script>
(()=>{'use strict';const $=id=>document.getElementById(id),canvas=$('canvas'),ctx=canvas.getContext('2d'),stage=$('stage'),overlay=$('overlay');let W=700,H=420,mode='menu',score=0,best=0,lives=3,wave=1,ship,rocks=[],shots=[],particles=[],stars=[],keys={},last=0,fireTimer=0,hyperCool=0;try{best=Number(localStorage.getItem('asteroids_high_score'))||0}catch(e){}const rand=(a,b)=>a+Math.random()*(b-a);
function resize(){let r=stage.getBoundingClientRect();W=Math.max(300,r.width);H=Math.max(220,r.height);const d=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(W*d);canvas.height=Math.round(H*d);ctx.setTransform(d,0,0,d,0,0);stars=Array.from({length:65},()=>({x:Math.random()*W,y:Math.random()*H,s:rand(.3,1)}));}new ResizeObserver(resize).observe(stage);resize();
function hud(){$('score').textContent=String(score).padStart(5,'0');$('lives').textContent=lives;$('wave').textContent='WAVE '+wave;$('best').textContent=String(best).padStart(5,'0')}
function resetShip(){ship={x:W/2,y:H/2,vx:0,vy:0,a:-Math.PI/2,inv:150}}function rock(x,y,size){const radius=[0,13,27,49][size];let vx=rand(-1.25,1.25),vy=rand(-1.25,1.25);if(Math.hypot(vx,vy)<.55)vx+=1;return{x,y,vx:vx*1.35/Math.sqrt(size),vy:vy*1.35/Math.sqrt(size),size,r:radius,a:rand(0,6.28),spin:rand(-.011,.011),shape:Array.from({length:10},()=>rand(.70,1.16))}}
function newWave(){rocks=[];for(let i=0;i<Math.min(3+wave,12);i++){let x,y,n=0;do{x=rand(0,W);y=rand(0,H);n++}while(Math.hypot(x-ship.x,y-ship.y)<Math.min(180,W*.32)&&n<100);rocks.push(rock(x,y,3))}ship.inv=Math.max(ship.inv,100)}
function start(){score=0;lives=3;wave=1;shots=[];particles=[];keys={};resetShip();newWave();mode='play';overlay.style.display='none';hud()}
function gameOver(){mode='over';best=Math.max(best,score);try{localStorage.setItem('asteroids_high_score',best)}catch(e){}overlay.style.display='flex';$('title').textContent='GAME OVER';$('subtitle').textContent='FINAL SCORE '+String(score).padStart(5,'0');$('start').textContent='PLAY AGAIN ▶';hud()}
function wrap(o,p=0){if(o.x< -p)o.x=W+p;if(o.x>W+p)o.x=-p;if(o.y< -p)o.y=H+p;if(o.y>H+p)o.y=-p}
function sparks(x,y,n=12){for(let i=0;i<n;i++){let a=rand(0,Math.PI*2),v=rand(.5,4);particles.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,t:rand(15,35)})}}
function destroyRock(i){const a=rocks[i];score+={1:100,2:50,3:20}[a.size];sparks(a.x,a.y,10);rocks.splice(i,1);if(a.size>1)for(let j=0;j<2;j++){let r=rock(a.x,a.y,a.size-1);r.vx+=a.vx*.45;r.vy+=a.vy*.45;rocks.push(r)}hud()}
function kill(){if(ship.inv>0)return;sparks(ship.x,ship.y,32);lives--;hud();if(lives<=0){gameOver();return}resetShip()}
function fire(){if(fireTimer>0||shots.length>=7)return;shots.push({x:ship.x+Math.cos(ship.a)*16,y:ship.y+Math.sin(ship.a)*16,vx:ship.vx+Math.cos(ship.a)*7.3,vy:ship.vy+Math.sin(ship.a)*7.3,t:66});fireTimer=10}
function hyper(){if(hyperCool>0||mode!=='play')return;ship.x=rand(25,Math.max(26,W-25));ship.y=rand(25,Math.max(26,H-25));ship.vx*=.4;ship.vy*=.4;ship.inv=80;hyperCool=180}
function update(dt){if(mode!=='play')return;const s=Math.min(dt/16.667,2.5);fireTimer=Math.max(0,fireTimer-s);hyperCool=Math.max(0,hyperCool-s);if(keys.left)ship.a-=.069*s;if(keys.right)ship.a+=.069*s;if(keys.thrust){ship.vx+=Math.cos(ship.a)*.17*s;ship.vy+=Math.sin(ship.a)*.17*s;if(Math.random()<.8){const a=ship.a+Math.PI;particles.push({x:ship.x-Math.cos(ship.a)*11,y:ship.y-Math.sin(ship.a)*11,vx:ship.vx+Math.cos(a)*rand(1,3)+rand(-.4,.4),vy:ship.vy+Math.sin(a)*rand(1,3)+rand(-.4,.4),t:rand(5,13)})}}if(keys.fire)fire();if(ship.inv>0)ship.inv-=s;ship.vx*=Math.pow(.996,s);ship.vy*=Math.pow(.996,s);let speed=Math.hypot(ship.vx,ship.vy);if(speed>5.7){ship.vx*=5.7/speed;ship.vy*=5.7/speed}ship.x+=ship.vx*s;ship.y+=ship.vy*s;wrap(ship,12);for(const r of rocks){r.x+=r.vx*s;r.y+=r.vy*s;r.a+=r.spin*s;wrap(r,r.r)}for(let i=shots.length-1;i>=0;i--){const b=shots[i];b.x+=b.vx*s;b.y+=b.vy*s;b.t-=s;wrap(b);if(b.t<=0){shots.splice(i,1);continue}let hit=-1;for(let j=0;j<rocks.length;j++)if(Math.hypot(b.x-rocks[j].x,b.y-rocks[j].y)<rocks[j].r*.88){hit=j;break}if(hit>=0){shots.splice(i,1);destroyRock(hit)}}if(ship.inv<=0)for(const r of rocks)if(Math.hypot(ship.x-r.x,ship.y-r.y)<r.r*.77+8){kill();break}for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.x+=p.vx*s;p.y+=p.vy*s;p.t-=s;if(p.t<=0)particles.splice(i,1)}if(rocks.length===0){wave++;score+=100;hud();newWave()}}
function draw(){ctx.fillStyle='#020708';ctx.fillRect(0,0,W,H);for(const st of stars){ctx.fillStyle='rgba(125,186,159,'+(.12+st.s*.22)+')';ctx.fillRect(st.x,st.y,st.s,st.s)}ctx.strokeStyle='#abfbd1';ctx.lineWidth=1.7;ctx.shadowColor='#66f9af';ctx.shadowBlur=5;for(const r of rocks){ctx.save();ctx.translate(r.x,r.y);ctx.rotate(r.a);ctx.beginPath();r.shape.forEach((v,i)=>{const a=i*Math.PI*2/r.shape.length,x=Math.cos(a)*r.r*v,y=Math.sin(a)*r.r*v;i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.closePath();ctx.stroke();ctx.restore()}ctx.shadowBlur=9;ctx.fillStyle='#d5ffe8';for(const b of shots){ctx.beginPath();ctx.arc(b.x,b.y,2.2,0,Math.PI*2);ctx.fill()}for(const p of particles){ctx.globalAlpha=Math.min(1,p.t/13);ctx.fillRect(p.x,p.y,2,2)}ctx.globalAlpha=1;if(ship&&mode!=='over'&&(ship.inv<=0||Math.floor(ship.inv/7)%2===0)){ctx.save();ctx.translate(ship.x,ship.y);ctx.rotate(ship.a);ctx.lineWidth=2.1;ctx.beginPath();ctx.moveTo(16,0);ctx.lineTo(-12,-10);ctx.lineTo(-8,0);ctx.lineTo(-12,10);ctx.closePath();ctx.stroke();ctx.restore()}ctx.shadowBlur=0;if(mode==='paused'){ctx.fillStyle='#000b';ctx.fillRect(0,0,W,H);ctx.fillStyle='#c5ffe1';ctx.textAlign='center';ctx.font='bold 30px monospace';ctx.fillText('PAUSED',W/2,H/2)}if(mode==='play'&&hyperCool>0){ctx.textAlign='left';ctx.font='11px monospace';ctx.fillStyle='#729c89';ctx.fillText('HYPER RECHARGING',14,H-15)}}
function loop(t){const dt=last?Math.min(t-last,40):16.667;last=t;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
$('start').addEventListener('click',start);$('pause').addEventListener('click',()=>{if(mode==='play')mode='paused';else if(mode==='paused')mode='play';$('pause').textContent=mode==='paused'?'▶':'Ⅱ'});const mapping={ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',ArrowUp:'thrust',KeyW:'thrust',Space:'fire',KeyH:'hyper',KeyP:'pause'};document.addEventListener('keydown',e=>{const k=mapping[e.code];if(!k||['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName))return;e.preventDefault();if(k==='hyper'&&!e.repeat)hyper();else if(k==='pause'&&!e.repeat)$('pause').click();else keys[k]=true});document.addEventListener('keyup',e=>{const k=mapping[e.code];if(k)keys[k]=false});window.addEventListener('blur',()=>keys={});document.querySelectorAll('[data-key]').forEach(b=>{const k=b.dataset.key;b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);if(k==='hyper')hyper();else keys[k]=true});const up=()=>{keys[k]=false};b.addEventListener('pointerup',up);b.addEventListener('pointercancel',up);b.addEventListener('lostpointercapture',up)});hud();
})();
</script></body></html>
